global
    log stdout format raw local0
    maxconn 1500

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen postgres_rw
    bind :5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 check port 8008 resolvers docker init-addr last,libc,none
    server postgres2 postgres2:5432 check port 8008 resolvers docker init-addr last,libc,none
    server postgres3 postgres3:5432 check port 8008 resolvers docker init-addr last,libc,none

listen postgres_ro
    bind :5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 check port 8008 resolvers docker init-addr last,libc,none
    server postgres2 postgres2:5432 check port 8008 resolvers docker init-addr last,libc,none
    server postgres3 postgres3:5432 check port 8008 resolvers docker init-addr last,libc,none

listen status
    bind :8404
    mode http
    monitor-uri /healthz
    stats enable
    stats uri /stats
